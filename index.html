```html
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>超ド派手！反射神経ゲーム</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, "Hiragino Kaku Gothic ProN", sans-serif;
      text-align: center;
      margin: 0;
      padding: 40px 20px;
      min-height: 100vh;

      /* 明るい背景 */
      background: linear-gradient(
        135deg,
        #ffe259,
        #ff8a80,
        #ff80ab,
        #b388ff,
        #80d8ff
      );
      background-size: 400% 400%;
      animation: backgroundMove 8s ease infinite;

      overflow-x: hidden;
    }

    @keyframes backgroundMove {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

    h1 {
      color: white;
      font-size: 38px;
      margin-bottom: 10px;

      text-shadow:
        0 0 5px #fff,
        0 0 15px #ff4081,
        0 0 30px #ff4081;

      animation: titlePulse 1.5s infinite alternate;
    }

    @keyframes titlePulse {
      from {
        transform: scale(1);
      }
      to {
        transform: scale(1.05);
      }
    }

    #message {
      font-size: 22px;
      font-weight: bold;
      color: white;
      margin: 20px 0;

      text-shadow: 2px 2px 5px rgba(0,0,0,0.25);
    }

    #gameArea {
      width: 360px;
      height: 360px;
      max-width: 90vw;
      max-height: 90vw;

      margin: 0 auto 25px;

      background:
        radial-gradient(circle, #ffffff 0%, #fff5fb 100%);

      border: 6px solid white;
      border-radius: 30px;

      position: relative;
      overflow: hidden;

      box-shadow:
        0 0 10px white,
        0 0 30px #ff4081,
        0 15px 40px rgba(0,0,0,0.25);

      transition: transform 0.2s;
    }

    /* ゲームエリアを揺らす */
    #gameArea.shake {
      animation: areaShake 0.45s;
    }

    @keyframes areaShake {
      0%, 100% {
        transform: translateX(0);
      }
      20% {
        transform: translateX(-10px) rotate(-1deg);
      }
      40% {
        transform: translateX(10px) rotate(1deg);
      }
      60% {
        transform: translateX(-7px);
      }
      80% {
        transform: translateX(7px);
      }
    }

    /* ターゲット */
    #target {
      width: 70px;
      height: 70px;

      background:
        radial-gradient(circle at 30% 30%, white, #ff4081 30%, #ff0055 70%);

      border: 5px solid white;
      border-radius: 50%;

      position: absolute;
      display: none;
      cursor: pointer;

      box-shadow:
        0 0 10px white,
        0 0 25px #ff4081,
        0 0 50px #ff0055;

      animation:
        targetAppear 0.5s cubic-bezier(.17,.89,.32,1.5),
        targetGlow 0.7s infinite alternate;
    }

    @keyframes targetAppear {
      0% {
        transform: scale(0) rotate(-180deg);
        opacity: 0;
      }

      70% {
        transform: scale(1.3) rotate(20deg);
        opacity: 1;
      }

      100% {
        transform: scale(1) rotate(0);
        opacity: 1;
      }
    }

    @keyframes targetGlow {
      from {
        box-shadow:
          0 0 10px white,
          0 0 25px #ff4081,
          0 0 40px #ff0055;
      }

      to {
        box-shadow:
          0 0 20px white,
          0 0 45px #ff4081,
          0 0 80px #ff0055;
      }
    }

    /* ターゲットをクリックした瞬間 */
    #target.hit {
      animation: targetHit 0.4s forwards;
    }

    @keyframes targetHit {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(2);
        opacity: 1;
      }

      100% {
        transform: scale(3.5);
        opacity: 0;
      }
    }

    /* ボタン */
    button {
      font-size: 21px;
      font-weight: bold;

      padding: 14px 35px;

      border: 4px solid white;
      border-radius: 50px;

      cursor: pointer;

      color: white;

      background: linear-gradient(
        135deg,
        #ff4081,
        #ff9800
      );

      box-shadow:
        0 5px 0 #d84315,
        0 8px 25px rgba(255, 64, 129, 0.5);

      transition:
        transform 0.15s,
        box-shadow 0.15s;
    }

    button:hover:not(:disabled) {
      transform: translateY(-4px) scale(1.05);

      box-shadow:
        0 8px 0 #d84315,
        0 15px 35px rgba(255, 64, 129, 0.6);
    }

    button:active:not(:disabled) {
      transform: translateY(3px);

      box-shadow:
        0 2px 0 #d84315,
        0 5px 15px rgba(255, 64, 129, 0.4);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* 画面に飛び散るエフェクト */
    .effect {
      position: fixed;
      pointer-events: none;
      z-index: 100;

      font-size: 30px;

      animation: effectMove 1.5s ease-out forwards;
    }

    @keyframes effectMove {
      0% {
        opacity: 1;
        transform:
          translate(0, 0)
          scale(0.3)
          rotate(0deg);
      }

      100% {
        opacity: 0;
        transform:
          translate(
            calc((var(--random-x) - 0.5) * 700px),
            calc((var(--random-y) - 0.5) * 700px)
          )
          scale(1.5)
          rotate(720deg);
      }
    }

    /* 結果表示 */
    #result {
      color: #ff4081;
      font-size: 30px;
      font-weight: bold;
      margin-top: 10px;
    }

    .resultPop {
      animation: resultPop 0.6s cubic-bezier(.17,.89,.32,1.5);
    }

    @keyframes resultPop {
      0% {
        transform: scale(0);
      }

      70% {
        transform: scale(1.3);
      }

      100% {
        transform: scale(1);
      }
    }
  </style>
</head>

<body>

  <h1>⚡ 超ド派手！反射神経ゲーム ⚡</h1>

  <p id="message">
    🔥 赤い丸が出たら、超高速でクリック！
  </p>

  <div id="gameArea">
    <div id="target"></div>
  </div>

  <div id="result"></div>

  <button id="startButton">
    🚀 スタート！
  </button>


  <script>

    const target = document.getElementById("target");
    const gameArea = document.getElementById("gameArea");
    const message = document.getElementById("message");
    const result = document.getElementById("result");
    const startButton = document.getElementById("startButton");

    let startTime = 0;
    let timerId = null;


    /* スタート */
    startButton.addEventListener("click", startGame);


    function startGame() {

      clearTimeout(timerId);

      target.style.display = "none";
      target.classList.remove("hit");

      result.textContent = "";

      message.textContent = "⏳ 準備してください……";

      startButton.disabled = true;

      gameArea.classList.remove("shake");

      void gameArea.offsetWidth;

      gameArea.classList.add("shake");


      /* 1～3秒のランダム待機 */
      const delay = 1000 + Math.random() * 2000;


      timerId = setTimeout(() => {

        const maxX = gameArea.clientWidth - 70;
        const maxY = gameArea.clientHeight - 70;

        const x = Math.random() * maxX;
        const y = Math.random() * maxY;


        target.style.left = x + "px";
        target.style.top = y + "px";

        target.style.display = "block";


        message.textContent =
          "🚨 今だ！！！！！クリック！！！ 🚨";


        startTime = performance.now();

      }, delay);
    }


    /* ターゲットをクリック */
    target.addEventListener("click", () => {

      const reactionTime =
        Math.round(performance.now() - startTime);


      target.classList.add("hit");

      message.textContent =
        "🎉 ナイスクリック！！ 🎉";


      /* 結果メッセージ */
      if (reactionTime < 200) {

        result.textContent =
          "⚡ 超高速！！人間離れした速さ！";

      } else if (reactionTime < 300) {

        result.textContent =
          "🔥 めちゃくちゃ速い！！";

      } else if (reactionTime < 500) {

        result.textContent =
          "✨ かなり速い！！";

      } else if (reactionTime < 800) {

        result.textContent =
          "👍 いい反応速度！";

      } else {

        result.textContent =
          "🐢 もう少しだけ早く！！";

      }


      result.textContent +=
        "  " + reactionTime + "ms";


      result.classList.remove("resultPop");

      void result.offsetWidth;

      result.classList.add("resultPop");


      /* 派手なエフェクト */
      createEffects();


      setTimeout(() => {

        target.style.display = "none";

        startButton.disabled = false;

        startButton.textContent =
          "🔄 もう一度チャレンジ！";

      }, 400);

    });


    /* キラキラ・絵文字を大量発生 */
    function createEffects() {

      const emojis = [
        "✨",
        "⭐",
        "🌟",
        "💥",
        "🎉",
        "🔥",
        "💫",
        "🎊",
        "⚡"
      ];


      for (let i = 0; i < 40; i++) {

        const effect =
          document.createElement("div");

        effect.className = "effect";

        effect.textContent =
          emojis[
            Math.floor(
              Math.random() * emojis.length
            )
          ];


        effect.style.left =
          (Math.random() * 100) + "vw";

        effect.style.top =
          (Math.random() * 100) + "vh";


        effect.style.setProperty(
          "--random-x",
          Math.random()
        );

        effect.style.setProperty(
          "--random-y",
          Math.random()
        );


        effect.style.animationDelay =
          (Math.random() * 0.3) + "s";


        document.body.appendChild(effect);


        setTimeout(() => {
          effect.remove();
        }, 2000);

      }

    }

  </script>

</body>
</html>
